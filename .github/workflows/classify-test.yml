name: Test language classification

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo de Workers AI"
        default: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      batch_size:
        description: "Nombres por petición"
        default: "40"
      list_models:
        description: "Solo listar los modelos de texto disponibles"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No necesita Playwright: classify.py solo usa la librería estándar.
      - name: Classify all locations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AI_MODEL: ${{ inputs.model }}
          CF_AI_BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          if [ "${{ inputs.list_models }}" = "true" ]; then
            python -m ig_places.classify --list-models
          else
            python -m ig_places.classify --all --languages out/languages.json --review out/review.csv
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classification-${{ github.run_id }}
          path: |
            out/
            logs/
          if-no-files-found: ignore
